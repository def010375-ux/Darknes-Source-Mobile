name: Android ARM64 native shell

on:
  push:
    branches: [ master ]
    paths:
      - "android/**"
      - ".github/workflows/android-arm64-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64-v8a debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK ABI
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdarknes_android_shell.so"
          echo "Verified ARM64 APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Darknes-Android-ARM64-Shell
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
