plugins {
    id "com.android.application"
}

android {
    namespace "com.darknes.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.darknes.mobile"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "0.1.0-native-shell"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}
